name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch: # Allows you to trigger it manually anytime

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate Graph
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: AyushBaware
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_days: 30
          plugin_activity_filter: commit
          filename: activity-graph.svg
          output_action: none # CRITICAL: Stops the plugin from auto-committing so our custom path script can run smoothly

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Safely move the output into your profile subdirectory
          mkdir -p profile
          mv /home/runner/work/AyushBaware/AyushBaware/activity-graph.svg ./profile/activity-graph.svg
          
          git add profile/activity-graph.svg
          git commit -m "Update activity graph" || exit 0
          git push
